# MLB選手デイリートラッカー: 30分おき自動実行
name: MLB Tracker

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mlb-tracker-run
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch stats, notify, and build page
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/fetch_and_notify.py

      - name: Commit and push updated data
        run: |
          git config user.name "mlb-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html state.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update tracker data"
            git pull --rebase
            git push
          fi
